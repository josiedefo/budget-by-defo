# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/budget_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Static resource caching (PWA)
# Spring Boot sends no Cache-Control for static resources by default, which lets
# browsers heuristically cache index.html and sw.js and strand users on a stale
# service worker after a deploy. no-cache means "revalidate", so these become
# cheap conditional GETs. Hashed files under /assets are served from the service
# worker's precache once it is active, so they never pay this cost.
spring.web.resources.cache.cachecontrol.no-cache=true
